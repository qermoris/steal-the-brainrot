<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Steal the branrot</title><meta name="title" content="Steal the branrot"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steal the Brainrot</title>

  <!-- Gaya CSS untuk memperelok susunan di tengah skrin -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 15px;
      text-shadow: 0 0 10px #00f2fe;
    }

    #gameCanvas {
      border: 4px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      cursor: pointer;
    }
  </style>



  <h1>🗿 STEAL THE BRAINROT 🗿</h1>

  <!-- 1. Canvas DULU -->
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <!-- 2. Script KEMUDIAN (supaya getContext tidak error) -->
  <script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let money = 0;
  let emojiSize = 50;
  let hasGodBrainrotSpawned = false; // Penanda God Brainrot

  const brainrotTypes = [
    { emoji: '🗿', value: 10 },
    { emoji: '💀', value: 15 },
    { emoji: '🍷', value: 25 },
    { emoji: '🤡', value: 50 },
    { emoji: '🧢', value: 75 },
    { emoji: '🥸', value: 100 }
  ];

  let brainrot = {
    x: 250,
    y: 200,
    emoji: '🗿',
    value: 10,
    isGod: false
  };

  function moveBrainrot() {
    brainrot.x = Math.floor(Math.random() * (canvas.width - emojiSize - 20)) + 10;
    brainrot.y = Math.floor(Math.random() * (canvas.height - emojiSize - 40)) + 40;

    let chance = Math.random() * 100;

    if (chance < 5 && !hasGodBrainrotSpawned) {
      brainrot.emoji = '👾';
      brainrot.value = 450;
      brainrot.isGod = true;
      hasGodBrainrotSpawned = true;
    } else if (chance < 10) {
      brainrot.emoji = '✨🗿✨';
      brainrot.value = 1000;
      brainrot.isGod = false;
    } else {
      let randomIndex = Math.floor(Math.random() * brainrotTypes.length);
      brainrot.emoji = brainrotTypes[randomIndex].emoji;
      brainrot.value = brainrotTypes[randomIndex].value;
      brainrot.isGod = false;
    }
  }

  function draw() {
    let gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#1a1c2e');
    gradient.addColorStop(1, '#130f40');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.beginPath();
    ctx.roundRect(15, 10, 220, 45, 10);
    ctx.fill();
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('💰 Money: $' + money, 25, 40);

    if (brainrot.isGod) {
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 25;
    } else {
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 15;
    }

    ctx.font = emojiSize + 'px Arial';
    ctx.fillText(brainrot.emoji, brainrot.x, brainrot.y);

    if (brainrot.isGod) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('the god brainrot', brainrot.x + (emojiSize / 2), brainrot.y + 20);
      ctx.textAlign = 'left';
    }

    ctx.shadowBlur = 0;
  }

  canvas.addEventListener('click', function(event) {
    const rect = canvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    if (
      clickX >= brainrot.x &&
      clickX <= brainrot.x + emojiSize &&
      clickY >= brainrot.y - emojiSize &&
      clickY <= brainrot.y
    ) {
      money += brainrot.value;
      moveBrainrot();
      draw();
    }
  });

  draw();
</script>


<script src="./script.js"></script></body></html>
