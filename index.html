<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Steal the branrot (Big update v8)</title><meta name="title" content="Steal the branrot (Big update v8)"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steal the Brainrot</title>

  <!-- Gaya CSS untuk memperelok susunan di tengah skrin -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 15px;
      text-shadow: 0 0 10px #00f2fe;
    }

    #gameCanvas {
      border: 4px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      cursor: pointer;
    }

    #newsBtn {
      position: absolute;
      top: 70px; /* Jarak dari atas */
      right: 20px; /* Jarak dari kanan */
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      padding: 10px 16px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #newsBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
    }
  </style>



  <h1>🗿 STEAL THE BRAINROT 🗿</h1>

  <a href="https://qermoris.github.io/aboutisd/" target="_blank" id="newsBtn">
    📰 News &amp; info
  </a>

  <!-- 1. Canvas DULU -->
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <!-- 2. Script KEMUDIAN (supaya getContext tidak error) -->
  <script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let money = parseInt(localStorage.getItem('savedMoney')) || 0;
  let isBlackout = false;
  let emojiSize = 50;
  let hasGodBrainrotSpawned = false; // Penanda God Brainrot

  const brainrotTypes = [
    { emoji: '🗿', value: 10 },
    { emoji: '💀', value: 15 },
    { emoji: '🍷', value: 25 },
    { emoji: '🤡', value: 50 },
    { emoji: '🧢', value: 75 },
    { emoji: '🥸', value: 100 },
  ];

  let brainrot = {
    x: 250,
    y: 200,
    emoji: '🗿',
    value: 10,
    type: 'normal'
  };

  function moveBrainrot() {
    brainrot.x = Math.floor(Math.random() * (canvas.width - emojiSize - 20)) + 10;
    brainrot.y = Math.floor(Math.random() * (canvas.height - emojiSize - 40)) + 40;

    let chance = Math.random() * 100;

    if (chance < 5 && !hasGodBrainrotSpawned) {
      brainrot.emoji = '👾';
      brainrot.value = 450;
      brainrot.type = 'god';
      hasGodBrainrotSpawned = true;
    } else if (chance >= 5 && chance < 10) {
      // Event: the golden boset
      brainrot.emoji = '🔱';
      brainrot.value = 45700;
      brainrot.type = 'boset';

      isBlackout = true;
      draw();

      setTimeout(function() {
        isBlackout = false;
        draw();
      }, 3000);

    } else if (chance < 20) {
      brainrot.emoji = '✨🗿✨';
      brainrot.value = 1000;
      brainrot.type = 'golden';
    } else {
      let randomIndex = Math.floor(Math.random() * brainrotTypes.length);
      brainrot.emoji = brainrotTypes[randomIndex].emoji;
      brainrot.value = brainrotTypes[randomIndex].value;
      brainrot.type = 'normal';
    }
  }

  function draw() {
    // 1. Semak jika skrin sedang blackout
    if (isBlackout) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff0000';
      ctx.font = 'bold 20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('⚠️ SOMETHING IS COMING... ⚠️', canvas.width / 2, canvas.height / 2);
      ctx.textAlign = 'left';
      return;
    }

    // 2. Lukis Latar Belakang Biasa
    let gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#1a1c2e');
    gradient.addColorStop(1, '#130f40');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 3. Banner Duit
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.beginPath();
    ctx.roundRect(15, 10, 220, 45, 10);
    ctx.fill();
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('💰 Money: $' + money, 25, 40);

    // 4. Setkan Glow Mengikut Jenis Emoji
    if (brainrot.type === 'god') {
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 25;
    } else if (brainrot.type === 'boset') {
      ctx.shadowColor = '#8b008b'; 
      ctx.shadowBlur = 35;
    } else {
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 15;
    }

    ctx.font = emojiSize + 'px Arial';
    ctx.fillText(brainrot.emoji, brainrot.x, brainrot.y);

    // 5. Teks Nama di Bawah Emoji
    if (brainrot.type === 'god') {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('the god brainrot', brainrot.x + (emojiSize / 2), brainrot.y + 20);
      ctx.textAlign = 'left';
    } else if (brainrot.type === 'boset') {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff007f';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('The golden boset', brainrot.x + (emojiSize / 2), brainrot.y + 20);
      ctx.textAlign = 'left';
    }

    ctx.shadowBlur = 0;
  }

  canvas.addEventListener('click', function(event) {
    if (isBlackout) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    if (
      clickX >= brainrot.x &&
      clickX <= brainrot.x + emojiSize &&
      clickY >= brainrot.y - emojiSize &&
      clickY <= brainrot.y
    ) {
      // Semakan Khas untuk The Golden Boset
      if (brainrot.type === 'boset') {
        if (money < brainrot.value) {
          alert("Sorry you can't having!");
          moveBrainrot();
          draw();
          return;
        }
      }

      // Jika cukup duit atau emoji biasa
      money += brainrot.value;
      localStorage.setItem('savedMoney', money);

      moveBrainrot();
      draw();
    }
  });

  draw();
</script>


<script src="./script.js"></script></body></html>
